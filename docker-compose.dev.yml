version: "3.8"

services:
  digestbot-dev:
    build: .
    container_name: digestbot-dev
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATABASE_PATH=/app/data/app.db
      - LOG_LEVEL=DEBUG
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - digestbot-network
    command: ["python", "-m", "digestbot", "run"]
    healthcheck:
      test: ["CMD", "python", "-m", "digestbot", "health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis-dev:
    image: redis:7-alpine
    container_name: digestbot-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    networks:
      - digestbot-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_dev_data:

networks:
  digestbot-network:
    driver: bridge
